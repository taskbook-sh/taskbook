[package]
name = "taskbook-server"
version = "1.5.0"
edition = "2021"
rust-version = "1.94"
description = "Server for taskbook sync"
license = "MIT"

[dependencies]
taskbook-common = { path = "../taskbook-common" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
argon2 = "0.6"
rand = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.7", features = ["cors", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
base64 = "0.23"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"

[[bin]]
name = "tb-server"
path = "src/main.rs"
